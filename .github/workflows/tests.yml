name: Tests

# see checks.yml
on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  pytest:
    # natively on both architectures: the tests build for the host's
    strategy:
      fail-fast: false
      # the tests shared by jobs, see XCRAFT_TEST_SHARD: more on x86_64, which tests more, like the ISOs
      matrix:
        include:
          - {runner: ubuntu-latest, shard: 1, shards: 3}
          - {runner: ubuntu-latest, shard: 2, shards: 3}
          - {runner: ubuntu-latest, shard: 3, shards: 3}
          - {runner: ubuntu-24.04-arm, shard: 1, shards: 2}
          - {runner: ubuntu-24.04-arm, shard: 2, shards: 2}
    name: pytest (${{ matrix.runner }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/uv-setup
      # the build tests run podman, rootless: the arm64 runners may not have it; the installs are tried again, as the
      # mirrors of Ubuntu may give the index of packages they do not have yet
      - run: |
          command -v podman || for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -qy podman && break
            [ "$i" = 3 ] && exit 1 || sleep 30
          done
      - run: podman info --format '{{.Version.Version}} {{.Host.Security.Rootless}}'
      # the ISOs, of x86_64, read with bsdtar and booted with QEMU, in KVM, which the runners have for the root only
      - if: runner.arch == 'X64'
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -qy libarchive-tools qemu-system-x86 qemu-utils ovmf && break
            [ "$i" = 3 ] && exit 1 || sleep 30
          done
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # what the tests make the same each time: their upstream packages, by their specs, and the resolutions, by what
      # they are resolved from, see conftest.py; those of the run only are saved again
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            tests/upstream/repos
            ~/.cache/xcraft-tests
          key: tests-${{ runner.arch }}-${{ matrix.shard }}-${{ matrix.shards }}-${{ hashFiles('tests/upstream/*.*') }}-${{ github.run_id }}
          restore-keys: tests-${{ runner.arch }}-${{ matrix.shard }}-${{ matrix.shards }}-${{ hashFiles('tests/upstream/*.*') }}-
      # the pinned packages, by their SHA-256, in the volume of podman xcraft finds them in
      - run: podman volume create xcraft-pinned
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage/volumes/xcraft-pinned/_data
          key: pinned-${{ runner.arch }}-${{ matrix.shard }}-${{ matrix.shards }}-${{ github.run_id }}
          restore-keys: pinned-${{ runner.arch }}-${{ matrix.shard }}-${{ matrix.shards }}-
      - run: touch "$RUNNER_TEMP/started"
      # pytest's colours only: FORCE_COLOR, or GITHUB_ACTIONS for typer, would make the output of xcraft the one of a
      # terminal, and CI the one of CI, which the tests do not expect; GitHub does not let the workflows set them
      - run: env -u GITHUB_ACTIONS -u CI XCRAFT_TEST_RESOLUTIONS="$HOME/.cache/xcraft-tests/resolutions" XCRAFT_TEST_SHARD=${{ matrix.shard }}/${{ matrix.shards }} pytest tests/ -v --color=yes
      # the resolutions of the run only, which the tests touch, saved by actions/cache
      - run: find "$HOME/.cache/xcraft-tests/resolutions" -type f ! -newer "$RUNNER_TEMP/started" -delete
