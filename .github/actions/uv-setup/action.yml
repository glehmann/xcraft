name: Setup uv and sync
description: Install uv and sync the dependencies, with the dev ones
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "0.10.x"
        activate-environment: true
    - run: uv sync --frozen
      shell: bash
      env:
        FORCE_COLOR: "1"
