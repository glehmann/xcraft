serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=3
# of the CD, or of the ISO on a USB stick, rather than of efiboot.img
search --no-floppy --file --set=root /install.img

menuentry "install" {
	linux /boot/vmlinuz console=ttyS0
	initrd /install.img
}
