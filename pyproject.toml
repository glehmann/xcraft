[project]
name = "xcraft"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "boto3>=1.35",
]

[project.scripts]
xcraft = "xcraft.__main__:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.115",
    "ipdb>=0.13.13",
    "prek>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
    "typos>=1.51.1",
    "zizmor>=1.31.1",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["xcraft*"]

[tool.setuptools.package-data]
xcraft = ["buildenv/*"]

[tool.typos.files]
# the specs of the test project
extend-exclude = ["tests/project/"]

[tool.typos.default.extend-words]
fpr = "fpr"  # the fingerprint records of gpg --with-colons
ba = "ba"    # rpmbuild -ba

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # incorrect-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "COM812",  # missing-trailing-comma
    "CPY001",  # missing-copyright-notice: no copyright headers in this project
    "FBT002",  # boolean-default-value-positional-argument: typer options are boolean defaults
    "S603",    # subprocess-without-shell-equals-true: running git, podman... is what this tool does
    "S607",    # start-process-with-partial-path
]

[tool.ruff.lint.per-file-ignores]
# typer reads the annotations of the commands at runtime
"xcraft/commands/*" = [
    "TC001",  # typing-only-first-party-import
    "TC003",  # typing-only-standard-library-import
]
# a script run in the build environment, not a module
"xcraft/buildenv/*" = [
    "INP001",  # implicit-namespace-package
]
"tests/**" = [
    "ARG001",   # unused-function-argument: the fixtures used for what they do, like project
    "S101",     # assert
    "D100",     # undocumented-public-module
    "D103",     # undocumented-public-function
    "D104",     # undocumented-public-package
    "PLR2004",  # magic-value-comparison
    "TC003",    # typing-only-standard-library-import
]

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
source = ["xcraft"]

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
addopts = "--pdbcls=IPython.terminal.debugger:TerminalPdb"
testpaths = ["tests"]
